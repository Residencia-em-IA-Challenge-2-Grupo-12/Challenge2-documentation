site_name: Challenge 2 - Documentacao
site_description: Documentacao do projeto Challenge 2 (Residencia em IA - Grupo 12)

nav:
  - Inicio: index.md
  - Definicao de Produto:
      - Visao Geral: produto/index.md
      - Visao do Produto: produto/visao-do-produto.md
      - Personas e Jornadas: produto/personas-e-jornadas.md
  - Requisitos:
      - Elicitacao:
          - Entrevista: requisitos/elicitacao/entrevista.md
          - Workshop: requisitos/elicitacao/workshop.md
      - Requisitos Elicitados: requisitos/requisitos.md
  - Guia de Contribuicao: guia-contribuicao.md
  - Convencoes de Documentacao: convencoes.md

validation:
  anchors: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
