site_name: Challenge 2 - Documentacao
site_description: Documentacao do projeto Challenge 2 (Residencia em IA - Grupo 12)

nav:
  - Inicio: index.md
  - Guia de Contribuicao: guia-contribuicao.md
  - Convencoes de Documentacao: convencoes.md
  - Requisitos:
      - Alinhamento Estrategico: requisitos/alinhamento-estrategico.md
      - Requisitos Elicitados: requisitos/requisitos.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
